schema_version: 1
metadata:
  name: "4-Way Signalized Cross"

vehicle_classes:
  - id: car
    length: 4
    min_gap: 2
    max_speed: 16.666666666666668
    max_acceleration: 3
    max_deceleration: -6
    car_following_model: idm
    lane_changing_model: lmrs
    reaction_time: 0
    model_params:
      perception:
        d_max: 400
      idm:
        desired_speed: 20
        time_headway: 1
      lmrs:
        a_min_coop: -1.7
        d_coop: 0.7
        d_free: 0.3
        d_sync: 0.5
        tau_relax: 10
        theta: 3

simulation:
  duration: 250
  timestep: 0.1
  warm_up: 0
  random_seed: 42

scenarios:
  baseline:
    network: network.yaml
    demand: demand.yaml
